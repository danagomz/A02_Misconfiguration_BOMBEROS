name: Security checks

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: core.settings.prod
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: bomberos_cali
      DB_USER: app_bomberos
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Verificar configuración de Django
        run: python manage.py check --deploy

      - name: Revisar dependencias vulnerables
        run: pip-audit -r requirements.txt

      - name: Revisar secretos del código actual
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --redact
